# BugXHunter in Docker: UI + passkey sign-in in `runner`, the agent in `agent`.
#
#   powershell -File docker/setup.ps1   # once: writes .env (secrets)
#   docker compose up -d --build
#   open http://localhost:8790
#
# Isolation model:
#   - `agent` has direct internet so scan tools run at full speed (nmap, ping
#     and raw DNS work too via NET_RAW). Outbound traffic is logged, not gated.
#   - `agent` holds NO SCX key: model calls go to runner's /scx/v1 proxy, which
#     injects the key, so the key never enters the sandbox.
#   - No host folders are mounted: projects live in the `workspace` volume.
#   - Both run as non-root with no-new-privileges; the agent drops all caps
#     except NET_RAW, and bash/edit actions are approved in the UI.
#
# ⚠ The agent has unrestricted outbound. Only point it at targets you are
#   authorised to test, and run this on a trusted machine/VM.

name: bugxhunter

# Images: `docker compose pull` fetches the published images (BXH_VERSION in
# .env picks a signed release, e.g. v1.2.3; default latest); `docker compose
# up -d --build` builds them locally instead. See SECURITY.md to verify a
# release's image digests before pulling.
services:
  runner:
    image: ghcr.io/cintelis/bugxhunter-runner:${BXH_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    environment:
      # Model key: prefer the vault (set up in the UI, sealed in the runner-data
      # volume). SCX_API in .env still works but sits in the clear.
      SCX_API: ${SCX_API:-}
      # Optional second provider (https://openrouter.ai/models): key in the vault
      # (OPENROUTER_API_KEY) or here; OPENROUTER_MODELS lists the ids the agent may use.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      OPEN_RUNNER_VAULT_FILE: /data/vault.json
      OPEN_RUNNER_VAULT_IDLE_MINUTES: ${OPEN_RUNNER_VAULT_IDLE_MINUTES:-120}
      OPEN_RUNNER_SECRET: ${OPEN_RUNNER_SECRET:-}
      SCX_PROXY_TOKEN: ${SCX_PROXY_TOKEN:?run docker/setup.ps1 first}
      OPENCODE_URL: http://agent:4096
      OPEN_RUNNER_WORKSPACE: /workspace
      OPEN_RUNNER_LOG_DIR: /logs             # audit log, one JSONL file per day
    volumes:
      - workspace:/workspace               # same volume as the agent: attachments
      - logs:/logs                         # audit + egress logs; NOT mounted in the agent, so it can't edit them
      - runner-data:/data                  # the sealed key vault (ciphertext only; see SECURITY.md)
    ports:
      - "127.0.0.1:${OPEN_RUNNER_PORT:-8790}:8790"   # localhost only; put TLS in front before exposing
    networks: [net]
    depends_on:
      agent:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  agent:
    image: ghcr.io/cintelis/bugxhunter-agent:${BXH_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      SCX_PROXY_TOKEN: ${SCX_PROXY_TOKEN:?run docker/setup.ps1 first}
      OPENCODE_ENABLE_EXA: "1"           # turns on OpenCode's websearch tool (Exa)
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}   # same list as runner: becomes an OpenCode provider via runner's proxy
    networks: [net]
    volumes:
      - workspace:/workspace
      - agent-data:/home/node/.local/share/opencode
    cap_drop: [ALL]
    cap_add: [NET_RAW]                   # raw sockets for nmap / ping / traceroute
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4096/global/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Passive egress logger: shares the agent's network namespace and sniffs its
  # outbound traffic (tcpdump), recording distinct destinations + DNS lookups to
  # /logs/egress-<date>.jsonl. Log-only — it never blocks traffic and
  # is not in the data path, so scans keep full speed.
  egress-logger:
    image: ghcr.io/cintelis/bugxhunter-agent:${BXH_VERSION:-latest}
    command: ["node", "/usr/local/lib/egress-logger.mjs"]
    network_mode: "service:agent"        # see the agent's connections
    user: root                           # needs CAP_NET_RAW effective (agent image defaults to non-root)
    environment:
      OPEN_RUNNER_LOG_DIR: /logs
    volumes:
      - logs:/logs
    cap_drop: [ALL]
    # NET_RAW: capture; SETUID/SETGID: tcpdump drops to its own user;
    # DAC_OVERRIDE: write into /logs (owned by the runner's user).
    cap_add: [NET_RAW, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [agent]
    restart: unless-stopped

networks:
  net: {}   # normal bridge: agent + runner share it, agent reaches the internet via NAT

volumes:
  workspace: {}
  agent-data: {}
  logs: {}         # read with: docker compose cp runner:/logs ./logs
  runner-data: {}  # vault.json: wrapped keys + ciphertext, useless without an unlock
