# Release: `git tag -a v1.2.3 -m "..." && git push origin v1.2.3` builds the
# tag into a DRAFT release with signed build provenance. Nothing is published
# until the maintainer verifies and signs it offline (scripts/sign-release.sh).
#
# Images are built natively for linux/amd64 and linux/arm64 (Apple Silicon,
# Graviton) on GitHub's own runners of each architecture, pushed by digest
# with zstd-compressed layers, and joined into one multi-arch tag per image;
# the attestation is on that manifest list, which is what images.txt pins and
# `docker compose pull` gets. The agent comes in two flavours: the default
# with the scan toolchain, and `-slim` without it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_RUNNER: ghcr.io/${{ github.repository_owner }}/bugxhunter-runner
  IMAGE_AGENT: ghcr.io/${{ github.repository_owner }}/bugxhunter-agent

jobs:
  # Fail fast, before six image builds: the tag must be the package version.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # actions are pinned to commits; the comment is the release they came from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Tag must match package.json
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag is v$tag but package.json says $pkg — bump package.json first" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: runner, flavor: "",      arch: amd64 }
          - { image: runner, flavor: "",      arch: arm64 }
          - { image: agent,  flavor: "",      arch: amd64 }
          - { image: agent,  flavor: "",      arch: arm64 }
          - { image: agent,  flavor: "-slim", arch: amd64 }
          - { image: agent,  flavor: "-slim", arch: arm64 }
    # native runners: no QEMU, so the agent toolchain and the OpenCode warm-up run at full speed
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: SECTOOLS=${{ matrix.flavor == '-slim' && '0' || '1' }}
          tags: ghcr.io/${{ github.repository_owner }}/bugxhunter-${{ matrix.image }}
          # zstd layers: 10-15% smaller than gzip and faster to unpack (Docker 23+)
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifests:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # sign the image provenance
      attestations: write
    outputs:
      runner_digest: ${{ steps.join.outputs.runner_digest }}
      agent_digest: ${{ steps.join.outputs.agent_digest }}
      agent_slim_digest: ${{ steps.join.outputs.agent_slim_digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: join
        name: Multi-arch tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          # key = image + flavour suffix, as the digest files are named
          for key in runner agent agent-slim; do
            image="${key%-slim}"; flavor="${key#"$image"}"
            ref="ghcr.io/${{ github.repository_owner }}/bugxhunter-$image"
            refs=""
            for f in /tmp/digests/$key-amd64 /tmp/digests/$key-arm64; do refs="$refs $ref@$(cat "$f")"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "$ref:v$VERSION$flavor" $refs
            digest=$(docker buildx imagetools inspect "$ref:v$VERSION$flavor" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$key: $ref:v$VERSION$flavor@$digest"
            echo "$(echo "$key" | tr - _)_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      # verifiable with: gh attestation verify oci://ghcr.io/cintelis/bugxhunter-runner:vX.Y.Z --repo cintelis/bugxhunter-runner
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_RUNNER }}
          subject-digest: ${{ steps.join.outputs.runner_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_AGENT }}
          subject-digest: ${{ steps.join.outputs.agent_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_AGENT }}
          subject-digest: ${{ steps.join.outputs.agent_slim_digest }}
          push-to-registry: true

  release:
    needs: [prepare, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Archives
        run: |
          set -eu
          mkdir -p dist
          # app: the compiled server + web app, runnable without Docker
          app="bugxhunter-runner_${VERSION}_app"
          mkdir -p "dist/$app/server" "dist/$app/web"
          cp -r server/dist "dist/$app/server/dist"
          cp server/package.json "dist/$app/server/"
          cp -r web/dist "dist/$app/web/dist"
          cp web/package.json "dist/$app/web/"
          cp package.json package-lock.json LICENSE README.md SECURITY.md .env.example "dist/$app/"
          tar -C dist -czf "dist/$app.tar.gz" "$app" && rm -rf "dist/$app"
          # deploy: docker compose pinned to this version's images
          deploy="bugxhunter-runner_${VERSION}_deploy"
          mkdir -p "dist/$deploy/docker"
          cp docker-compose.yml .env.example LICENSE "dist/$deploy/"
          cp docker/setup.ps1 docker/copy-in.ps1 docker/copy-out.ps1 "dist/$deploy/docker/"
          echo "v$VERSION" > "dist/$deploy/VERSION"
          tar -C dist -czf "dist/$deploy.tar.gz" "$deploy" && rm -rf "dist/$deploy"
          ls -l dist

      # images.txt pins each multi-arch image by its manifest-list digest; it is
      # covered by checksums.txt and therefore by the maintainer's signature.
      - name: Image digests and checksums
        run: |
          set -eu
          {
            echo "${IMAGE_RUNNER}:v${VERSION}@${{ needs.manifests.outputs.runner_digest }}"
            echo "${IMAGE_AGENT}:v${VERSION}@${{ needs.manifests.outputs.agent_digest }}"
            echo "${IMAGE_AGENT}:v${VERSION}-slim@${{ needs.manifests.outputs.agent_slim_digest }}"
          } > dist/images.txt
          (cd dist && for f in *.tar.gz images.txt; do sha256sum "$f"; done > checksums.txt && cat images.txt checksums.txt)

      # verifiable with: gh attestation verify <file> --repo cintelis/bugxhunter-runner
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/images.txt
            dist/checksums.txt

      # a draft: nothing is installable until the maintainer signs checksums.txt
      # offline and publishes (scripts/sign-release.sh). A rerun replaces an
      # earlier draft of the same tag.
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/images.txt dist/checksums.txt \
            --draft --title "BugXHunter $GITHUB_REF_NAME" --generate-notes

  # The same build, as `npx bugxhunter`. Published with npm provenance (the
  # package is attested to this workflow run; `npm audit signatures` checks it).
  # Needs the package's "trusted publisher" on npmjs.com to be this repository
  # and this workflow file, with direct publishing allowed; no token is stored.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run build
      - run: npm run pack:npm
      - name: Smoke-test the package
        run: |
          set -eu
          # pack into a temp folder: a tarball left inside dist/npm would be published as part of the package
          cd dist/npm && npm pack --silent --pack-destination "$RUNNER_TEMP" >/dev/null
          node bin/bugxhunter.mjs --version | grep -qx "$(node -p "require('./package.json').version")"
      - run: npm publish ./dist/npm --provenance --access public
