name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker images
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runner.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: agent image (without the pentest toolchain, to keep CI quick)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          build-args: SECTOOLS=0
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
