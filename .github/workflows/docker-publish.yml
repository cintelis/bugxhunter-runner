# Publishes the images to GitHub Container Registry on every push to master:
#   ghcr.io/<owner>/bugxhunter-runner, bugxhunter-agent and bugxhunter-agent:*-slim
# Tags: `latest` and `sha-<short>` (plus `latest-slim` / `sha-<short>-slim` for
# the agent without the scan toolchain), each a multi-arch manifest
# (linux/amd64 + linux/arm64, built natively on runners of each architecture)
# with zstd-compressed layers. Versioned, signed images come from release.yml.
name: Docker publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { image: runner, flavor: "",      arch: amd64 }
          - { image: runner, flavor: "",      arch: arm64 }
          - { image: agent,  flavor: "",      arch: amd64 }
          - { image: agent,  flavor: "",      arch: arm64 }
          - { image: agent,  flavor: "-slim", arch: amd64 }
          - { image: agent,  flavor: "-slim", arch: arm64 }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: SECTOOLS=${{ matrix.flavor == '-slim' && '0' || '1' }}
          tags: ghcr.io/${{ github.repository_owner }}/bugxhunter-${{ matrix.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.image }}${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          for key in runner agent agent-slim; do
            image="${key%-slim}"; flavor="${key#"$image"}"
            ref="ghcr.io/${{ github.repository_owner }}/bugxhunter-$image"
            refs=""
            for f in /tmp/digests/$key-amd64 /tmp/digests/$key-arm64; do refs="$refs $ref@$(cat "$f")"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "$ref:latest$flavor" -t "$ref:sha-$short$flavor" $refs
            docker buildx imagetools inspect "$ref:latest$flavor" | head -12
          done
