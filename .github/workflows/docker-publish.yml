# Publishes the two images to GitHub Container Registry on every push to master:
#   ghcr.io/<owner>/bugxhunter-runner  and  ghcr.io/<owner>/bugxhunter-agent
# Tags: `latest` and `sha-<short>`, each a multi-arch manifest (linux/amd64 +
# linux/arm64, built natively on runners of each architecture). Versioned,
# signed images come from release.yml instead.
name: Docker publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        image: [runner, agent]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/bugxhunter-${{ matrix.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          for image in runner agent; do
            ref="ghcr.io/${{ github.repository_owner }}/bugxhunter-$image"
            refs=""
            for f in /tmp/digests/$image-*; do refs="$refs $ref@$(cat "$f")"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "$ref:latest" -t "$ref:sha-$short" $refs
            docker buildx imagetools inspect "$ref:latest" | head -20
          done
